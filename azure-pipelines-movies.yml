trigger:
  branches:
    include:
      - main  # Trigger builds on commits to the main branch

pr:
  branches:
    include:
      - main  # Trigger builds on pull requests targeting the main branch

name: FieldOperationsIT-Build-$(Year:yyyy).$(Month).$(DayOfMonth)-$(Build.BuildId)

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.x'  # Ensure .NET 8.x SDK is available

stages:
  - stage: Build
    displayName: Build and Test
    jobs:
      - job: BuildAndTest
        displayName: Build, Test, and Package API
        steps:
          # Use .NET SDK 8.x
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: $(dotnetVersion)

          # Debug: List files in the repository
          - task: PowerShell@2
            displayName: 'List Files in Repository'
            inputs:
              targetType: 'inline'
              script: |
                Get-ChildItem -Recurse

          # Restore dependencies for the solution
          - task: DotNetCoreCLI@2
            displayName: 'Restore Dependencies'
            inputs:
              command: 'restore'
              projects: '**/*.sln'  # Adjust the path if required

          # Build the solution
          - task: DotNetCoreCLI@2
            displayName: 'Build Solution'
            inputs:
              command: 'build'
              projects: '**/*.sln'
              arguments: '--configuration $(buildConfiguration) --verbosity normal'

          # Run Unit Tests
          - task: DotNetCoreCLI@2
            displayName: 'Run Unit Tests'
            inputs:
              command: 'test'
              projects: '**/**/Movies.API.Test.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore --verbosity normal'

          # Publish the API project
          - task: DotNetCoreCLI@2
            displayName: 'Publish API'
            inputs:
              command: 'publish'
              projects: 'movies-api/**/Movies.API.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'

  - stage: Publish
    displayName: Publish Artifacts
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: Publish
        displayName: Publish Build Artifacts
        steps:
          # Publish build artifacts for deployment
          - publish: $(Build.ArtifactStagingDirectory)
            artifact: 'drop'
            displayName: 'Publish Build Artifacts'
